repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff-format
        entry: bash -c 'python3 -m ruff format "$@" && git add -- "$@"' --
        language: system
        types_or: [python, pyi]
        stages: [pre-commit]

      - id: pytest
        name: pytest
        entry: pytest -q --ignore=tests/test_encoder.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
